[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperloglog"
version = "0.1.0"
description = "HyperLogLog (Flajolet et al., 2007) from scratch: estimate distinct counts over huge streams in kilobytes with ~1% error. Zero deps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []   # zero third-party deps — pure stdlib

[project.scripts]
hyperloglog = "hyperloglog.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hyperloglog*"]

[tool.setuptools.package-data]
hyperloglog = ["py.typed"]
